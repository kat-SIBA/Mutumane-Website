<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order | Mutumane Kota 'N' Grilled Chicken</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="Images/LOGO.jpg" alt="Mutumane Logo">
                <div>
                    MUTUMANE 
                    <span>KOTA 'N' GRILLED CHICKEN</span>
                </div>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="orders.html" class="active">Order</a></li>
                    <li><a href="aboutUs.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="enquiry.html">Enquiry</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-container">
        <div class="section-title">
            <h1>Place Your Order</h1>
            <p>Choose your meal and provide your details so we can prepare your order.</p>
        </div>

        <div class="order-box">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label for="item">Select Your Order</label>
                    <select id="item" name="item" required>
                        <option value="">-- Select an item --</option>
                        <option value="classic-kota">Classic Boss Kota - R55</option>
                        <option value="full-chicken">Full Flame-Grilled Chicken - R140</option>
                        <option value="half-chicken">Half Chicken & Chips - R85</option>
                        <option value="kota-special">Kota Special - From R25</option>
                        <option value="pap-meal">Pap Meal - From R45</option>
                        <option value="combo">Family Combo - R150</option>
                        <option value="extra-sides">Extra Sides</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity</label>
                    <input type="number" id="quantity" name="quantity" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="order-type">Order Type</label>
                    <select id="order-type" name="order-type" required>
                        <option value="">-- Select order type --</option>
                        <option value="pickup">Pickup</option>
                        <option value="delivery">Delivery</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address / Pickup Notes</label>
                    <textarea id="address" name="address" placeholder="Enter your delivery address or pickup instructions"></textarea>
                </div>

                <div class="form-group">
                    <label for="notes">Special Requests</label>
                    <textarea id="notes" name="notes" placeholder="Any special requests?"></textarea>
                </div>

                <button type="submit" class="btn-primary">Submit Order</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Mutumane Kota 'N' Grilled Chicken. All Rights Reserved.</p>
    </footer>

</body>
</html>
