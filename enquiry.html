<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="brand">
                <img src="Images/LOGO.jpg" alt="Mutumane Logo">
                <div>
                    MUTUMANE 
                    <span>KOTA 'N' GRILLED CHICKEN</span>
                </div>
            </a>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="menu.html">Menu</a></li>
                    <li><a href="orders.html">Order</a></li>
                    <li><a href="aboutUs.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="enquiry.html" class="active">Enquiry</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-container">
        <div class="section-title">
            <h1>Make An Enquiry</h1>
            <p>Have a question? Send us a message and we'll get back to you.</p>
        </div>

        <div class="order-box">
            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
                </div>

                <div class="form-group">
                    <label for="subject">Enquiry Type</label>
                    <select id="subject" name="subject" required>
                        <option value="">-- Select an enquiry type --</option>
                        <option value="general">General Enquiry</option>
                        <option value="catering">Catering</option>
                        <option value="menu">Menu Information</option>
                        <option value="order">Order Question</option>
                        <option value="business">Business Enquiry</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" name="message" placeholder="Type your enquiry here..." required></textarea>
                </div>

                <button type="submit" class="btn-primary">Send Enquiry</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Mutumane Kota 'N' Grilled Chicken. All Rights Reserved.</p>
    </footer>

</body>
</html>
